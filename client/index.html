<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consistent Hashing File Upload</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #18202a; }
    main { width: min(560px, calc(100% - 32px)); padding: 28px; box-sizing: border-box; background: white; border: 1px solid #e0e5eb; border-radius: 16px; box-shadow: 0 12px 36px #17203312; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #536170; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-weight: 650; }
    input[type="file"] { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd3dd; border-radius: 9px; background: white; }
    button { margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 9px; background: #185adb; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 9px; background: #f3f5f8; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Upload a file</h1>
    <p>Select a file to upload. The backend consistent hashing ring will automatically route it to the appropriate storage node.</p>

    <label for="fileInput">File</label>
    <input id="fileInput" type="file" />

    <button id="uploadBtn">Upload file</button>
    <div id="status" role="status" aria-live="polite">Select a file to upload.</div>
  </main>

  <script src="./script.js" defer></script>
</body>
</html>
